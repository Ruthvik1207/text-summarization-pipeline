version: '3.8'

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: summarai_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - summarai-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: summarai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_models:/app/models
      - backend_artifacts:/app/artifacts
      - backend_reports:/app/reports
    environment:
      - MODEL_NAME=google/flan-t5-small
      - MODEL_VERSION=1.0.0
      - DEVICE=cpu
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=text-summarization
      - DATABASE_URL=sqlite:///./data/summarai.db
    depends_on:
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - summarai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: summarai_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_started
    networks:
      - summarai-net

networks:
  summarai-net:
    driver: bridge

volumes:
  mlflow_data:
  backend_data:
  backend_models:
  backend_artifacts:
  backend_reports:
