services:
  # Unified Full-Stack Web Service (Serves both Liquid Glass React UI & FastAPI REST API from 1 Render instance)
  - type: web
    name: text-summarization-pipeline
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEVICE
        value: cpu
      - key: MODEL_NAME
        value: google/flan-t5-small
      - key: MLFLOW_TRACKING_URI
        value: http://127.0.0.1:5000
      - key: MLFLOW_PUBLIC_URL
        value: /mlflow/
      - key: CORS_ORIGINS
        value: '["*"]'
